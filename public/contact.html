<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CLOXS LLCへのお問い合わせ、不具合報告、ご要望を送信できます。">
  <title>お問い合わせ | CLOXS LLC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path fill="%23FF5C5C" d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm56,112H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48a8,8,0,0,1,0,16Z"></path></svg>'>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"M PLUS Rounded 1c"', 'sans-serif'],
          },
          colors: {
            toy: {
              red: '#FF5C5C',
              blue: '#4DA8DA',
              yellow: '#FFD166',
              green: '#54C286',
              light: '#FDFBF7',
              dark: '#2D3748'
            }
          },
          boxShadow: {
            pop: '6px 6px 0px 0px rgba(45,55,72,1)',
            'pop-sm': '3px 3px 0px 0px rgba(45,55,72,1)',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #FDFBF7;
      background-image: radial-gradient(#FFD166 2px, transparent 2px);
      background-size: 30px 30px;
    }
  </style>
</head>
<body class="min-h-screen text-toy-dark font-sans antialiased selection:bg-toy-yellow selection:text-toy-dark">
  <header class="px-4 pt-5">
    <div class="max-w-4xl mx-auto bg-white border-4 border-toy-dark rounded-full shadow-pop flex items-center justify-between px-5 sm:px-7 py-3">
      <a href="/" class="flex items-center gap-2" aria-label="CLOXS LLC トップへ">
        <i class="ph-fill ph-clock text-4xl text-toy-red"></i>
        <span class="text-2xl sm:text-3xl font-black tracking-wider flex">
          <span class="text-toy-blue">C</span>
          <span class="text-toy-red">L</span>
          <span class="text-toy-yellow">O</span>
          <span class="text-toy-green">X</span>
          <span class="text-toy-dark">S</span>
        </span>
      </a>
      <a href="/" class="font-black hover:text-toy-blue transition-colors">
        <i class="ph-bold ph-house mr-1"></i> トップへ
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-12 sm:py-16">
    <div class="text-center mb-9">
      <div class="inline-flex items-center gap-2 bg-toy-yellow border-4 border-toy-dark shadow-pop-sm rounded-full px-5 py-2 font-black mb-5">
        <i class="ph-bold ph-envelope-simple"></i> CONTACT
      </div>
      <h1 class="text-4xl sm:text-5xl font-black mb-4">お問い合わせ</h1>
      <p class="font-bold text-gray-600 leading-relaxed">
        アプリやサービスの不具合・ご要望、そのほかのお問い合わせはこちらからお送りください。
      </p>
    </div>

    <section class="bg-white border-4 border-toy-dark rounded-3xl shadow-pop p-6 sm:p-9">
      <form id="contact-form" action="https://formspree.io/f/xljrvdjr" method="POST" class="space-y-6" novalidate>
        <input id="contact-subject" type="hidden" name="_subject" value="CLOXS LLC お問い合わせ">
        <input id="contact-source-url" type="hidden" name="source_url" value="">
        <div class="hidden" aria-hidden="true">
          <label>この欄は空のままにしてください<input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
        </div>

        <div class="grid sm:grid-cols-2 gap-5">
          <label class="block font-black">
            お名前 <span class="text-toy-red">*</span>
            <input id="contact-name" name="name" type="text" autocomplete="name" required maxlength="80"
              class="mt-2 w-full rounded-2xl border-2 border-toy-dark px-4 py-3 font-bold bg-white focus:outline-none focus:ring-4 focus:ring-toy-yellow/60"
              placeholder="例：山田 太郎">
          </label>
          <label class="block font-black">
            メールアドレス <span class="text-toy-red">*</span>
            <input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="200"
              class="mt-2 w-full rounded-2xl border-2 border-toy-dark px-4 py-3 font-bold bg-white focus:outline-none focus:ring-4 focus:ring-toy-yellow/60"
              placeholder="example@example.com">
          </label>
        </div>

        <div class="grid sm:grid-cols-2 gap-5">
          <label class="block font-black">
            対象サービス・アプリ
            <input id="contact-service" name="service" type="text" maxlength="120"
              class="mt-2 w-full rounded-2xl border-2 border-toy-dark px-4 py-3 font-bold bg-white focus:outline-none focus:ring-4 focus:ring-toy-yellow/60"
              placeholder="例：都営でGO">
          </label>
          <label class="block font-black">
            種別 <span class="text-toy-red">*</span>
            <select id="contact-category" name="category" required
              class="mt-2 w-full rounded-2xl border-2 border-toy-dark px-4 py-3 font-bold bg-white focus:outline-none focus:ring-4 focus:ring-toy-yellow/60">
              <option value="">選択してください</option>
              <option value="不具合・要望">不具合・要望</option>
              <option value="お問い合わせ">お問い合わせ</option>
              <option value="その他">その他</option>
            </select>
          </label>
        </div>

        <label class="block font-black">
          お問い合わせ内容 <span class="text-toy-red">*</span>
          <textarea id="contact-message" name="message" required maxlength="3000" rows="8"
            class="mt-2 w-full rounded-2xl border-2 border-toy-dark px-4 py-3 font-bold bg-white focus:outline-none focus:ring-4 focus:ring-toy-yellow/60"
            placeholder="不具合の場合は、端末名・OS・アプリのバージョン・発生した操作や症状なども添えていただけると確認がスムーズです。"></textarea>
        </label>

        <p class="text-sm font-bold text-gray-500">
          送信内容は、CLOXS LLCのアプリ・サービスに関する確認とご連絡のために利用します。
        </p>

        <p id="contact-error" class="hidden bg-red-50 text-red-700 border-2 border-red-200 rounded-2xl px-4 py-3 font-bold" role="alert"></p>
        <p id="contact-success" class="hidden bg-green-50 text-green-800 border-2 border-green-200 rounded-2xl px-4 py-3 font-bold" role="status">
          <i class="ph-bold ph-check-circle mr-1"></i> 送信しました。ありがとうございます！
        </p>

        <div class="flex flex-col-reverse sm:flex-row gap-3 sm:justify-between sm:items-center">
          <button type="button" onclick="history.back()"
            class="border-2 border-toy-dark rounded-full px-6 py-3 font-black hover:bg-gray-100 transition-colors">
            <i class="ph-bold ph-arrow-left mr-1"></i> 戻る
          </button>
          <button id="contact-submit" type="submit"
            class="bg-toy-yellow border-4 border-toy-dark shadow-pop rounded-full px-8 py-4 font-black hover:translate-y-1 hover:shadow-pop-sm transition-all disabled:opacity-60 disabled:cursor-not-allowed disabled:translate-y-0">
            <i class="ph-bold ph-paper-plane-tilt mr-1"></i> 送信する
          </button>
        </div>
      </form>
    </section>
  </main>

  <footer class="pb-10 px-4 text-center text-sm font-bold text-gray-500">
    &copy; 2015 CLOXS LLC. All rights reserved.
  </footer>

  <script>
    const contactForm = document.getElementById('contact-form');
    const contactName = document.getElementById('contact-name');
    const contactEmail = document.getElementById('contact-email');
    const contactService = document.getElementById('contact-service');
    const contactCategory = document.getElementById('contact-category');
    const contactMessage = document.getElementById('contact-message');
    const contactSubject = document.getElementById('contact-subject');
    const contactSourceUrl = document.getElementById('contact-source-url');
    const contactError = document.getElementById('contact-error');
    const contactSuccess = document.getElementById('contact-success');
    const contactSubmit = document.getElementById('contact-submit');

    if (!(contactForm instanceof HTMLFormElement)) throw new Error('#contact-form was not found.');
    if (!(contactName instanceof HTMLInputElement)) throw new Error('#contact-name was not found.');
    if (!(contactEmail instanceof HTMLInputElement)) throw new Error('#contact-email was not found.');
    if (!(contactService instanceof HTMLInputElement)) throw new Error('#contact-service was not found.');
    if (!(contactCategory instanceof HTMLSelectElement)) throw new Error('#contact-category was not found.');
    if (!(contactMessage instanceof HTMLTextAreaElement)) throw new Error('#contact-message was not found.');
    if (!(contactSubject instanceof HTMLInputElement)) throw new Error('#contact-subject was not found.');
    if (!(contactSourceUrl instanceof HTMLInputElement)) throw new Error('#contact-source-url was not found.');
    if (!(contactError instanceof HTMLElement)) throw new Error('#contact-error was not found.');
    if (!(contactSuccess instanceof HTMLElement)) throw new Error('#contact-success was not found.');
    if (!(contactSubmit instanceof HTMLButtonElement)) throw new Error('#contact-submit was not found.');

    const params = new URLSearchParams(window.location.search);
    const allowedParams = new Set(['service', 'category']);
    for (const key of params.keys()) {
      if (!allowedParams.has(key)) throw new Error(`Unsupported query parameter: ${key}`);
      if (params.getAll(key).length !== 1) throw new Error(`Query parameter must appear exactly once: ${key}`);
    }

    const initialService = params.get('service');
    if (initialService !== null) {
      if (initialService.length > 120) throw new RangeError('service query parameter exceeds 120 characters.');
      contactService.value = initialService;
    }

    const initialCategory = params.get('category');
    if (initialCategory !== null) {
      const categoryValues = Array.from(contactCategory.options, option => option.value);
      if (!categoryValues.includes(initialCategory) || initialCategory.length === 0) {
        throw new RangeError(`Unsupported category query parameter: ${initialCategory}`);
      }
      contactCategory.value = initialCategory;
    }

    contactSourceUrl.value = document.referrer || window.location.href;

    function updateSubject() {
      const service = contactService.value.trim();
      const category = contactCategory.value;
      const prefix = service.length > 0 ? service : 'CLOXS LLC';
      const suffix = category.length > 0 ? category : 'お問い合わせ';
      contactSubject.value = `${prefix} ${suffix}`;
    }

    function showContactError(message) {
      if (typeof message !== 'string' || message.length === 0) {
        throw new TypeError('Contact error message must be non-empty.');
      }
      contactSuccess.classList.add('hidden');
      contactError.textContent = message;
      contactError.classList.remove('hidden');
    }

    function clearContactStatus() {
      contactError.textContent = '';
      contactError.classList.add('hidden');
      contactSuccess.classList.add('hidden');
    }

    contactService.addEventListener('input', updateSubject);
    contactCategory.addEventListener('change', updateSubject);
    updateSubject();

    contactForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearContactStatus();

      const name = contactName.value.trim();
      const email = contactEmail.value.trim();
      const category = contactCategory.value;
      const message = contactMessage.value.trim();

      if (name.length === 0 || email.length === 0 || category.length === 0 || message.length === 0) {
        showContactError('お名前、メールアドレス、種別、お問い合わせ内容を入力してください。');
        return;
      }
      if (!contactEmail.checkValidity()) {
        showContactError('メールアドレスの形式を確認してください。');
        return;
      }

      updateSubject();
      contactSubmit.disabled = true;
      contactSubmit.innerHTML = '<i class="ph-bold ph-circle-notch mr-1 animate-spin"></i> 送信中…';

      try {
        const response = await fetch(contactForm.action, {
          method: 'POST',
          body: new FormData(contactForm),
          headers: { Accept: 'application/json' }
        });

        if (!response.ok) {
          throw new Error(`Formspree returned HTTP ${response.status} ${response.statusText}.`);
        }

        contactForm.reset();
        contactService.value = initialService ?? '';
        contactCategory.value = initialCategory ?? '';
        updateSubject();
        contactSuccess.classList.remove('hidden');
      } catch (error) {
        console.error('Contact form submission failed.', error);
        showContactError('送信できませんでした。時間をおいてもう一度お試しください。');
      } finally {
        contactSubmit.disabled = false;
        contactSubmit.innerHTML = '<i class="ph-bold ph-paper-plane-tilt mr-1"></i> 送信する';
      }
    });
  </script>
</body>
</html>
