<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんアプ - スマホアプリ (生徒版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#2563EB',
                            dark: '#1E3A8A',
                            light: '#EFF6FF',
                            accent: '#F59E0B',
                            gray: '#F8FAFC'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #E2E8F0; /* デバイスの背景として少し暗く */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* スマートフォンのモックアップフレーム */
        .device-frame {
            width: 375px;
            height: 812px;
            background-color: #F8FAFC;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 12px solid #1E293B;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 上部のノッチ風デザイン */
        .device-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background-color: #1E293B;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 50;
        }

        /* スクロールバー非表示 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 押しやすい立体的なボタン */
        .btn-pressable {
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 0 #1E3A8A; /* 濃いブルーの影 */
        }
        .btn-pressable:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 #1E3A8A;
        }
        
        .btn-pressable-green {
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 0 #047857; /* 濃いグリーンの影 */
        }
        .btn-pressable-green:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 #047857;
        }

        /* 入力フォームのフォーカス時のアニメーション */
        .input-field {
            transition: all 0.2s ease;
        }
        .input-field:focus {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }
    </style>
</head>
<body>

    <!-- Device 1: 教室ID入力画面 (最初の画面) -->
    <div id="screen-join" class="device-frame mx-4 flex flex-col">
        <div class="device-notch"></div>
        
        <!-- 背景装飾 -->
        <div class="absolute top-0 left-0 w-full h-1/2 bg-brand-blue rounded-b-[3rem] -z-10"></div>
        
        <div class="flex-1 flex flex-col justify-center px-8 relative z-10 pt-12 pb-8">
            <div class="bg-white rounded-3xl p-8 shadow-xl text-center relative">
                <!-- ロゴマーク -->
                <div class="absolute -top-10 left-1/2 transform -translate-x-1/2 w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg border-4 border-brand-light">
                    <i class="ph-fill ph-users-three text-4xl text-brand-blue"></i>
                </div>
                
                <h2 class="text-3xl font-black text-brand-dark mt-6 mb-2">みんアプ</h2>
                <p class="text-sm font-bold text-gray-500 mb-8">教室でアプリを楽しもう</p>
                
                <div class="space-y-6 text-left">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            先生に教えてもらった<br><span class="text-brand-accent">教室ID（アルファベットと数字）</span>を入れてね
                        </label>
                        <input type="text" id="tenant-id" placeholder="例: abcd-1234" class="input-field w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-4 text-gray-800 font-bold focus:outline-none focus:border-brand-blue focus:bg-white text-center text-lg tracking-widest uppercase">
                    </div>
                    
                    <button onclick="showLoginScreen()" class="w-full bg-brand-blue text-white font-black text-xl py-4 rounded-xl btn-pressable flex items-center justify-center gap-2 mt-4">
                        つぎへ <i class="ph-bold ph-arrow-right"></i>
                    </button>
                </div>
                
                <div class="mt-8 pt-6 border-t border-gray-100">
                    <p class="text-xs font-bold text-gray-400">IDがわからないときは、先生に聞いてみましょう。</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Device 2: ログイン画面 -->
    <div id="screen-login" class="device-frame mx-4 hidden flex-col">
        <div class="device-notch"></div>
        
        <div class="pt-12 pb-4 px-6 flex items-center relative z-10">
            <button onclick="showJoinScreen()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm text-gray-600 hover:bg-gray-50 transition-colors">
                <i class="ph-bold ph-caret-left text-xl"></i>
            </button>
            <span class="ml-4 font-bold text-gray-700">戻る</span>
        </div>

        <div class="flex-1 flex flex-col justify-center px-8 pb-12">
            <div class="text-center mb-8">
                <div class="inline-block bg-brand-light text-brand-blue font-bold px-4 py-1 rounded-full text-sm mb-4 border border-blue-100">
                    つながりました！
                </div>
                <h2 class="text-2xl font-black text-brand-dark" id="display-tenant-name">東京パソコン教室</h2>
                <p class="text-sm font-bold text-gray-500 mt-2">の、みんアプに入ります。</p>
            </div>
            
            <div class="space-y-5 bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                        <i class="ph-fill ph-user text-gray-400 text-lg"></i> あなたの番号（ID）
                    </label>
                    <input type="text" placeholder="例: user123" class="input-field w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3.5 text-gray-800 font-bold focus:outline-none focus:border-brand-blue focus:bg-white">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                        <i class="ph-fill ph-lock-key text-gray-400 text-lg"></i> 秘密の言葉（パスワード）
                    </label>
                    <input type="password" placeholder="••••••••" class="input-field w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3.5 text-gray-800 font-bold focus:outline-none focus:border-brand-blue focus:bg-white tracking-widest">
                </div>
                
                <div class="pt-4">
                    <button onclick="showCatalogScreen()" class="w-full bg-green-600 text-white font-black text-xl py-4 rounded-xl btn-pressable-green flex items-center justify-center gap-2">
                        教室に入る <i class="ph-bold ph-sign-in"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Device 3: アプリ一覧（カタログ）画面 -->
    <div id="screen-catalog" class="device-frame mx-4 hidden">
        <div class="device-notch"></div>
        
        <!-- App Header -->
        <div class="bg-brand-blue pt-12 pb-4 px-6 text-white shadow-md relative z-10">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-sm font-bold opacity-80" id="header-tenant-name">東京パソコン教室</h1>
                    <h2 class="text-2xl font-black">みんなの作品棚</h2>
                </div>
                <button onclick="showJoinScreen()" class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition-colors">
                    <i class="ph-bold ph-sign-out text-xl"></i>
                </button>
            </div>
        </div>

        <!-- App Content (Scrollable) -->
        <div class="flex-1 overflow-y-auto hide-scrollbar p-6 pb-24 bg-brand-gray relative">
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-6 flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center flex-shrink-0 text-brand-blue shadow-sm">
                    <i class="ph-fill ph-info text-xl"></i>
                </div>
                <p class="text-sm font-bold text-brand-dark leading-snug">
                    先生がOKしたアプリだけが並んでいます。<br>好きなものをタップして遊んでみよう！
                </p>
            </div>

            <div class="space-y-4">
                <!-- App Card 1 -->
                <div class="bg-white rounded-2xl p-4 shadow-[0_4px_10px_rgba(0,0,0,0.05)] border border-gray-100 flex items-center gap-4 cursor-pointer hover:bg-gray-50 transition-colors">
                    <div class="w-16 h-16 bg-red-100 text-red-500 rounded-xl flex items-center justify-center flex-shrink-0 border-2 border-red-200">
                        <i class="ph-fill ph-alien text-3xl"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-lg font-black text-gray-800 mb-1">モンスター討伐タイマー</h4>
                        <div class="flex items-center gap-2 text-sm text-gray-500 font-medium">
                            <i class="ph-fill ph-user-circle"></i>
                            <span>ゆうき くん</span>
                            <span class="bg-brand-accent text-white text-[10px] px-2 py-0.5 rounded-full font-black ml-auto">NEW</span>
                        </div>
                    </div>
                    <i class="ph-bold ph-play-circle text-brand-blue text-3xl"></i>
                </div>

                <!-- App Card 2 -->
                <div class="bg-white rounded-2xl p-4 shadow-[0_4px_10px_rgba(0,0,0,0.05)] border border-gray-100 flex items-center gap-4 cursor-pointer hover:bg-gray-50 transition-colors">
                    <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center flex-shrink-0 border-2 border-purple-200">
                        <i class="ph-fill ph-magic-wand text-3xl"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-lg font-black text-gray-800 mb-1">ふしぎなお絵かき</h4>
                        <div class="flex items-center gap-2 text-sm text-gray-500 font-medium">
                            <i class="ph-fill ph-user-circle"></i>
                            <span>さくら ちゃん</span>
                        </div>
                    </div>
                    <i class="ph-bold ph-play-circle text-brand-blue text-3xl"></i>
                </div>

                <!-- App Card 3 -->
                <div class="bg-white rounded-2xl p-4 shadow-[0_4px_10px_rgba(0,0,0,0.05)] border border-gray-100 flex items-center gap-4 cursor-pointer hover:bg-gray-50 transition-colors">
                    <div class="w-16 h-16 bg-green-100 text-green-600 rounded-xl flex items-center justify-center flex-shrink-0 border-2 border-green-200">
                        <i class="ph-fill ph-calculator text-3xl"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-lg font-black text-gray-800 mb-1">九九マスター道場</h4>
                        <div class="flex items-center gap-2 text-sm text-gray-500 font-medium">
                            <i class="ph-fill ph-user-circle"></i>
                            <span>けんた くん</span>
                        </div>
                    </div>
                    <i class="ph-bold ph-play-circle text-brand-blue text-3xl"></i>
                </div>
            </div>
            
            <div class="mt-8 text-center border-t border-gray-200 pt-6">
                 <p class="text-gray-400 font-bold text-sm flex items-center justify-center gap-1">
                     <i class="ph-fill ph-check-circle"></i> すべてのアプリを表示しました
                 </p>
            </div>
        </div>

        <!-- Floating Action Button (リロード用) -->
        <div class="absolute bottom-6 right-6 z-20">
            <button class="w-14 h-14 bg-white text-brand-blue rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.1)] border-2 border-gray-100 flex items-center justify-center hover:bg-gray-50 transition-colors">
                <i class="ph-bold ph-arrows-clockwise text-2xl"></i>
            </button>
        </div>
    </div>

    <script>
        // 画面切り替えのロジック
        function showJoinScreen() {
            document.getElementById('screen-join').classList.remove('hidden');
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-catalog').classList.add('hidden');
            document.getElementById('tenant-id').value = ''; // リセット
        }

        function showLoginScreen() {
            const tenantId = document.getElementById('tenant-id').value.trim();
            if (!tenantId) {
                // 本来はUIでエラー表示しますが、今回は簡易的なモックのためアラートを避けてそのまま進めます
            }
            
            // 入力されたIDっぽく名前をでっち上げる（デモ用）
            const displayNames = document.querySelectorAll('#display-tenant-name, #header-tenant-name');
            const name = tenantId ? `${tenantId.toUpperCase()} クラス` : '東京パソコン教室';
            displayNames.forEach(el => el.textContent = name);

            document.getElementById('screen-join').classList.add('hidden');
            document.getElementById('screen-login').classList.remove('hidden');
            document.getElementById('screen-catalog').classList.add('hidden');
            document.getElementById('screen-login').classList.add('flex');
        }

        function showCatalogScreen() {
            document.getElementById('screen-join').classList.add('hidden');
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-login').classList.remove('flex');
            document.getElementById('screen-catalog').classList.remove('hidden');
            document.getElementById('screen-catalog').classList.add('flex', 'flex-col');
        }
    </script>
</body>
</html>
