<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - みんアプ 先生用ポータル</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#2563EB',
                            dark: '#1E3A8A',
                            light: '#EFF6FF',
                            accent: '#F59E0B',
                            gray: '#F8FAFC',
                            green: '#10B981',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #E2E8F0; /* 少し濃いグレーで背景を沈ませる */
        }
        
        /* 押しやすい立体的なボタン */
        .btn-pressable {
            transition: all 0.1s ease;
            position: relative;
        }
        .btn-pressable:active {
            transform: translateY(4px);
        }
        .btn-shadow-blue { box-shadow: 0 4px 0 0 #1E3A8A; }
        .btn-shadow-blue:active { box-shadow: 0 0px 0 0 #1E3A8A; }

        /* 入力フォームのフォーカス時のアニメーション */
        .input-field {
            transition: all 0.2s ease;
        }
        .input-field:focus {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <!-- ログインカード全体のコンテナ -->
    <div class="w-full max-w-5xl bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[600px]">
        
        <!-- 左側：ブランディングエリア（PCで表示） -->
        <div class="w-full md:w-5/12 bg-brand-dark p-10 flex flex-col justify-between relative overflow-hidden text-white">
            <!-- 装飾的な背景グラデーション -->
            <div class="absolute top-[-20%] left-[-20%] w-[140%] h-[140%] bg-gradient-to-br from-brand-blue/40 to-transparent rounded-full opacity-50 blur-3xl pointer-events-none"></div>
            
            <div class="relative z-10">
                <!-- ロゴ -->
                <div class="flex items-center gap-3 mb-12">
                    <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-lg">
                        <i class="ph-fill ph-users-three text-3xl text-brand-blue"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black tracking-wider leading-none">みんアプ</h1>
                        <p class="text-xs font-bold text-brand-accent mt-1">先生用ポータル</p>
                    </div>
                </div>

                <!-- メッセージ -->
                <h2 class="text-3xl lg:text-4xl font-black leading-tight mb-6">
                    生徒のアイデアを<br>
                    安全に、クラスへ。
                </h2>
                <p class="text-gray-300 font-medium leading-relaxed mb-8">
                    みんアプは、パソコン教室・プログラミングスクール向けのアプリ共有プラットフォームです。生徒が作った作品を先生が確認し、ワンクリックでクラス全員のスマホに届けます。
                </p>
            </div>

            <!-- 下部の装飾アイコン -->
            <div class="relative z-10 flex items-center gap-4 text-brand-blue opacity-50">
                <i class="ph-fill ph-robot text-4xl"></i>
                <i class="ph-bold ph-arrow-right text-2xl"></i>
                <i class="ph-fill ph-check-circle text-4xl"></i>
                <i class="ph-bold ph-arrow-right text-2xl"></i>
                <i class="ph-fill ph-device-mobile text-4xl"></i>
            </div>
        </div>

        <!-- 右側：ログインフォームエリア -->
        <div class="w-full md:w-7/12 p-8 md:p-16 flex flex-col justify-center bg-brand-gray relative">
            
            <div class="max-w-md w-full mx-auto">
                <h3 class="text-2xl font-black text-brand-dark mb-2">おかえりなさい</h3>
                <p class="text-gray-500 font-bold text-sm mb-10">登録済みのメールアドレスとパスワードでログインしてください。</p>

                <form action="teacher-portal.html" method="GET" class="space-y-6">
                    
                    <!-- メールアドレス -->
                    <div>
                        <label for="email" class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                            <i class="ph-fill ph-envelope-simple text-gray-400 text-lg"></i> メールアドレス
                        </label>
                        <input type="email" id="email" name="email" required placeholder="teacher@example.com" 
                            class="input-field w-full bg-white border-2 border-gray-200 rounded-xl px-4 py-3.5 text-gray-800 font-bold focus:outline-none focus:border-brand-blue placeholder-gray-300">
                    </div>

                    <!-- パスワード -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label for="password" class="block text-sm font-bold text-gray-700 flex items-center gap-2">
                                <i class="ph-fill ph-lock-key text-gray-400 text-lg"></i> パスワード
                            </label>
                            <a href="#" class="text-sm font-bold text-brand-blue hover:text-brand-dark hover:underline transition-colors">
                                お忘れですか？
                            </a>
                        </div>
                        <div class="relative">
                            <input type="password" id="password" name="password" required placeholder="••••••••" 
                                class="input-field w-full bg-white border-2 border-gray-200 rounded-xl px-4 py-3.5 text-gray-800 font-bold focus:outline-none focus:border-brand-blue placeholder-gray-300 tracking-widest">
                            
                            <!-- パスワード表示切り替えボタン（モックアップ） -->
                            <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                                <i class="ph-bold ph-eye text-xl"></i>
                            </button>
                        </div>
                    </div>

                    <!-- ログイン状態を保持 -->
                    <div class="flex items-center pt-2">
                        <input id="remember-me" name="remember-me" type="checkbox" 
                            class="h-5 w-5 text-brand-blue focus:ring-brand-blue border-2 border-gray-300 rounded cursor-pointer">
                        <label for="remember-me" class="ml-3 block text-sm font-bold text-gray-600 cursor-pointer">
                            次回から自動的にログインする
                        </label>
                    </div>

                    <!-- ログインボタン -->
                    <div class="pt-6">
                        <button type="submit" class="w-full bg-brand-blue text-white font-black text-xl py-4 rounded-xl btn-pressable btn-shadow-blue flex items-center justify-center gap-2">
                            ログインする <i class="ph-bold ph-sign-in"></i>
                        </button>
                    </div>
                </form>

                <!-- 新規登録への導線 -->
                <div class="mt-12 text-center border-t border-gray-200 pt-8">
                    <p class="text-sm font-bold text-gray-500 mb-4">みんアプを初めてご利用の先生へ</p>
                    <a href="minapp-lp.html#contact" class="inline-flex items-center justify-center w-full bg-white border-2 border-gray-200 text-gray-600 font-black py-3 rounded-xl hover:bg-gray-50 hover:border-gray-300 transition-colors">
                        導入のご相談・デモ環境のお申し込み <i class="ph-bold ph-arrow-up-right ml-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
