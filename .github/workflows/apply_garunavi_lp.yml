name: Apply garunavi LP update

on:
  push:
    branches:
      - feat/garunavi-offline-cache-copy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/garunavi-offline-cache-copy

      - name: Decode screenshots and patch LP
        run: python .tmp/apply_garunavi_lp.py

      - name: Verify generated assets
        run: |
          test -f public/garunavi/assets/android/history_update.webp
          test -f public/garunavi/assets/android/clip_update.webp
          test ! -e .tmp
          test ! -e .github/workflows/apply_garunavi_lp.yml
          grep -q '履歴の新着をまとめてチェック' public/garunavi/index.html
          grep -q 'クリップしたコメントの反応をまとめて確認' public/garunavi/index.html

      - name: Commit final LP update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: add bulk update sections to garunavi LP"
          git push
