name: Optimize Kotohogu home screenshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kotohogu-home-webp.yml

permissions:
  contents: write

jobs:
  optimize-home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Validate, optimize, and update LP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from PIL import Image
          import subprocess

          root = Path("public/kotohogu")
          src = root / "assets/screenshots/Screenshot_20261017_194738.png"
          dst = root / "assets/screenshots/Screenshot_20261017_194738.webp"
          html_path = root / "index.html"

          if not src.is_file() or not html_path.is_file():
              raise FileNotFoundError(f"Required input missing: {src} or {html_path}")

          actual_blob_sha = subprocess.check_output(
              ["git", "hash-object", str(src)], text=True
          ).strip()
          expected_blob_sha = "87565fa66be88b56c221e8ffea0bc5a79af5fb74"
          if actual_blob_sha != expected_blob_sha:
              raise ValueError(
                  f"Screenshot does not match approved source: "
                  f"expected={expected_blob_sha} actual={actual_blob_sha}"
              )

          with Image.open(src) as original:
              if original.format != "PNG" or original.size != (921, 2048):
                  raise ValueError(
                      f"Unexpected source: format={original.format} "
                      f"size={original.size}; expected PNG 921x2048"
                  )
              optimized = original.convert("RGB").resize(
                  (460, 1023), Image.Resampling.LANCZOS
              )
              optimized.save(dst, format="WEBP", quality=86, method=6)

          with Image.open(dst) as check:
              if check.format != "WEBP" or check.size != (460, 1023):
                  raise ValueError(
                      f"Invalid output: format={check.format}, size={check.size}"
                  )
          if not 10_000 <= dst.stat().st_size <= 250_000:
              raise ValueError(f"Unexpected output byte size: {dst.stat().st_size}")

          old = "https://raw.githubusercontent.com/kaeruko/kotohogu/db2bd2db5771e6d2edefcb8e5e21c37626da340c/docs/screenshots/home-town-background.jpg"
          new = "./assets/screenshots/Screenshot_20261017_194738.webp"
          html = html_path.read_text(encoding="utf-8")
          if html.count(old) != 1 or new in html:
              raise ValueError("Expected one original home screenshot URL, and no pre-existing optimized reference")
          html = html.replace(old, new)
          html = html.replace(
              'alt="コトホグのアプリ画面。桜のまちのホーム" width="414" height="900"',
              'alt="コトホグの最新ホーム画面。桜のまちと住民たち" width="460" height="1023"',
          )
          if old in html or html.count(new) != 1:
              raise ValueError("Failed to update the homepage screenshot reference")
          html_path.write_text(html, encoding="utf-8")
          print(f"Created {dst}: {dst.stat().st_size} bytes")
          PY
      - name: Commit optimized image and LP reference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kotohogu/assets/screenshots/Screenshot_20261017_194738.webp public/kotohogu/index.html
          git diff --cached --exit-code && { echo "No changes to commit" >&2; exit 1; } || test "$?" -eq 1
          git commit -m "Optimize Kotohogu home screenshot and use it in LP"
          git push origin HEAD:main
