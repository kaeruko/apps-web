name: Kotohogu feature graphic

on:
  workflow_dispatch:
  push:
    paths:
      - public/kotohogu/assets/feature-graphic.svg
      - .github/workflows/kotohogu-feature-graphic.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install SVG renderer and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-cjk
      - name: Render exact 1024x500 PNG
        run: |
          rsvg-convert -f png -w 1024 -h 500 \
            -o public/kotohogu/assets/feature-graphic.png \
            public/kotohogu/assets/feature-graphic.svg
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path('public/kotohogu/assets/feature-graphic.png')
          raw = p.read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n', 'Output must be PNG'
          assert struct.unpack('>II', raw[16:24]) == (1024, 500), 'Incorrect feature graphic dimensions'
          print(f'{p}: 1024x500, {len(raw)} bytes')
          PY
      - name: Commit regenerated PNG to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kotohogu/assets/feature-graphic.png
          if ! git diff --cached --quiet; then
            git commit -m "Add Kotohogu Google Play feature graphic"
            git push origin HEAD:main
          fi
